apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.metadata.labels.app }}-deployment
  labels:
    app: {{ .Values.metadata.labels.app }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.metadata.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.metadata.labels.app }}
    spec:
      containers:
        - name: {{ .Values.metadata.labels.app }}-container
          image: {{ .Values.containers.image }}:{{ .Values.containers.imagetag }}
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.containers.ports.containerPort }}
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5     
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.containers.ports.containerPort }}
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5          
          ports:
            - containerPort: {{ .Values.containers.ports.containerPort }}
              protocol: TCP
          env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: retail-store-ui-configmap
                  key: RETAIL_UI_CHAT_BEDROCK_REGION
          envFrom:
            - configMapRef:
                name: {{ .Values.metadata.labels.app }}-configmap
      imagePullSecrets:
        - name: ecr-cred